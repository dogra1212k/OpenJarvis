name: Build Hindi JARVIS APK
on:
  workflow_dispatch:
  push:
    branches: [main, jarvis-gemini-online]
    paths:
      - "android-client/**"
      - ".github/workflows/android-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android native build tools
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download and verify bundled offline model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --output app/src/main/assets/offline-model.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf
          curl --fail --location --output app/src/main/assets/Qwen-LICENSE.txt https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/LICENSE
          curl --fail --location --output app/src/main/assets/llama-LICENSE.txt https://raw.githubusercontent.com/ggml-org/llama.cpp/988190680d5a89fce97de3c20df2c2813731fd61/LICENSE
          echo "7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed  app/src/main/assets/offline-model.gguf" | sha256sum -c -
      - name: Render native C++ logo preview
        run: |
          g++ -std=c++17 -O2 -DJARVIS_RENDER_PREVIEW app/src/main/cpp/logo.cpp -o logo-preview
          ./logo-preview logo-preview.ppm
      - name: Build offline APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify bundled model and native runtime
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as z:
              assert 'assets/offline-model.gguf' in z.namelist()
              assert 'res/drawable/j_foreground.xml' in z.namelist()
              assert any(n.endswith('/ic_launcher.xml') for n in z.namelist())
              assert 'lib/arm64-v8a/libjarvis_offline.so' in z.namelist()
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Online-AI-APK
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
